<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-success text-white text-center">
              <h1>Appointment Successful</h1>
            </div>
            <div class="card-body">
              <p>
                Thank you, <strong>{{ name }}</strong>. Your appointment has been booked
                successfully.
              </p>
              <p>We have sent a confirmation email to <strong>{{ email }}</strong>.</p>
              <p>Your appointment details:</p>
            </div>
            <ul class="list-group list-group-flush mb-4">
              <li class="list-group-item">Phone Number:</strong> {{ phone }}</li>
              <li class="list-group-item">Doctor:</strong> {{ doctor }}</li>
              <li class="list-group-item">Date:</strong> {{ date }}</li>
            </ul>
            <div class="d-grid">
              
              <a href="{% url 'success' %}" class="btn btn-primary">Book Another Appointment</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
  </html>
